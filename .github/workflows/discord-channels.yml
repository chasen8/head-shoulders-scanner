# Discord bot setup (D34/D35): set the interactions endpoint URL and register the slash commands
# (/watchlist, /notify). The bot token is read from secrets and never printed. The channel-listing step
# was removed before the repo went public, so run logs show no server or channel names.
name: Discord bot setup

on:
  workflow_dispatch:
    inputs:
      guild_id:
        description: "Register the slash commands in this server only (takes effect at once); empty = global (up to 1 h)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7  # for bot/register-commands.mjs
      - name: Set the interactions endpoint URL (D34 setup)
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          WATCHLIST_API_URL: ${{ secrets.WATCHLIST_API_URL }}
        run: |
          python3 - <<'EOF'
          import json, os, sys, urllib.request
          url = os.environ["WATCHLIST_API_URL"].rstrip("/") + "/interactions"
          req = urllib.request.Request("https://discord.com/api/v10/applications/@me", method="PATCH",
                                       data=json.dumps({"interactions_endpoint_url": url}).encode(),
                                       headers={"Authorization": "Bot " + os.environ["DISCORD_BOT_TOKEN"],
                                                "Content-Type": "application/json",
                                                "User-Agent": "ihs-setup (github actions, 1.0)"})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print("interactions endpoint set:", json.load(r).get("interactions_endpoint_url"))
          except urllib.error.HTTPError as e:
              body = e.read().decode("utf-8", "replace")[:300]
              sys.exit(f"PATCH /applications/@me -> HTTP {e.code}: {body}")
          EOF
      - name: Register slash commands /watchlist, /notify (D35)
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ inputs.guild_id }}
        run: |
          DISCORD_APPLICATION_ID=$(python3 - <<'EOF'
          import json, os, sys, urllib.request
          req = urllib.request.Request("https://discord.com/api/v10/applications/@me",
                                       headers={"Authorization": "Bot " + os.environ["DISCORD_BOT_TOKEN"],
                                                "User-Agent": "ihs-setup (github actions, 1.0)"})
          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  print(json.load(r)["id"])
          except urllib.error.HTTPError as e:
              sys.exit(f"GET /applications/@me -> HTTP {e.code}")
          EOF
          )
          export DISCORD_APPLICATION_ID
          echo "application id: $DISCORD_APPLICATION_ID"
          node bot/register-commands.mjs
