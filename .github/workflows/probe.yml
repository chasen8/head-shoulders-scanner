name: Probe exchanges
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public endpoints
        run: |
          probe() {
            code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 20 -H 'User-Agent: Mozilla/5.0' "$1" || echo curlfail)
            echo "=== $code  $1"
            head -c 200 /tmp/body; echo
          }
          probe "https://data-api.binance.vision/api/v3/klines?symbol=BTCUSDT&interval=4h&limit=2"
          probe "https://fapi.binance.com/fapi/v1/exchangeInfo"
          probe "https://fapi.binance.com/fapi/v1/klines?symbol=BTCUSDT&interval=4h&limit=5"
          probe "https://www.okx.com/api/v5/public/instruments?instType=SPOT"
          probe "https://www.okx.com/api/v5/public/instruments?instType=SWAP"
          probe "https://www.okx.com/api/v5/market/candles?instId=BTC-USDT&bar=4H"
          probe "https://www.okx.com/api/v5/market/history-candles?instId=BTC-USDT&bar=4H&limit=100"
          probe "https://api.bybit.com/v5/market/kline?category=linear&symbol=BTCUSDT&interval=240&limit=5"
          probe "https://api.gateio.ws/api/v4/futures/usdt/candlesticks?contract=BTC_USDT&interval=4h&limit=5"
          probe "https://api.mexc.com/api/v3/klines?symbol=BTCUSDT&interval=4h&limit=5"
          probe "https://api.bitget.com/api/v2/mix/market/candles?symbol=BTCUSDT&productType=usdt-futures&granularity=4H&limit=5"
