# 掃描並建置網站資料。
# 目前：repo 是私有的、暫不部署 GitHub Pages（使用者 2026-10-18 決定）。
#   - 只能手動觸發（Actions 分頁 → Scan and build site → Run workflow）。
#   - 跑 pytest → build_site.py（抓幣安公開 K 線、寫 site/data/scan.json）→
#     把整個 site/ 上傳成 artifact「site」，下載解壓後在 site/ 內跑
#     `python -m http.server` 即可本機預覽。
# 不需要任何 secret：幣安公開端點 data-api.binance.vision（charter D3，美國 IP 可用）。
name: Scan and build site

on:
  workflow_dispatch:
  # 排程：改成公開 repo 或決定部署方式後再啟用。
  # 4h K 線在 UTC 00/04/08/12/16/20 收盤；排在收盤後 7 分鐘、避開整點擁塞。
  # 若改這裡，build_site.py 的 SCAN_EVERY_HOURS / SCAN_MINUTE 也要一起改（網站「下次掃描」用它）。
  # 排程觸發時 GITHUB_EVENT_NAME=schedule，build_site.py 會自動寫入 next_scan_at；
  # 手動觸發則寫 null，網站顯示「目前沒有定時掃描」。
  # schedule:
  #   - cron: "7 */4 * * *"

permissions:
  contents: read
  # 啟用 Pages 部署時再打開：
  # pages: write
  # id-token: write

concurrency:
  group: scan-and-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Scan and write site/data/scan.json
        run: python build_site.py

      - name: Upload site as artifact
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: site/
          retention-days: 14
          if-no-files-found: error

      # ---- GitHub Pages 部署（暫停用；啟用時把上面 upload-artifact 換成這兩段，並打開 permissions）----
      # - uses: actions/upload-pages-artifact@v5
      #   with:
      #     path: site/

