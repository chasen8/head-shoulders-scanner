# 台股（上市＋上櫃普通股）定時掃描 + Discord 通知（charter D29）。
#   資料：股票清單 TWSE / TPEx OpenAPI，K 線 Yahoo Finance chart API（runner 需 cookie + crumb，
#   ihs_scanner/data_tw.py 處理）；全是公開端點、不需金鑰、不需註冊。
#   結果：site/data/tw/scan.json + bars/；通知狀態 state_tw.json（與加密貨幣分開）。
#   發布：共用 publish.yml，只換掉台股自己的檔案，保留加密貨幣的 data/scan.json、data/bars、state.json。
#
# 排程：平日 UTC 06:10 = 台北 14:10（13:30 收盤後 40 分鐘；build_site_tw.py 的 SCAN_HOUR_UTC /
# SCAN_MINUTE_UTC 要一起改）。國定假日照跑，只是不會有新 K 線。
name: Scan TW stocks and notify

on:
  schedule:
    - cron: "10 6 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只印出會發送的內容，不送 Discord、不更新 scan-state、不發布網站"
        type: boolean
        default: false
      notify_all:
        description: "沒有 state 時逐筆通知（預設只發一則摘要）"
        type: boolean
        default: false
      test_message:
        description: "只送一則「測試：圖片通知」（目前分數最高 1 筆，附圖；不改 state、不發布），用來驗證 Discord 圖片上傳"
        type: boolean
        default: false

permissions:
  contents: write  # publish job 推 scan-state 分支

concurrency:
  group: scan-tw
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # 約 2000 檔 × 2 次 Yahoo 請求，5 次/秒約 13–15 分鐘
    outputs:
      build_ok: ${{ steps.build.outcome == 'success' }}
    env:
      DRY_RUN: ${{ github.event.inputs.dry_run }}
      NOTIFY_ALL: ${{ github.event.inputs.notify_all }}
      TEST_MESSAGE: ${{ github.event.inputs.test_message }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      # 失敗率 >20% 會非零退出 -> 不通知、不發布（D18）。
      - name: Scan and write site/data/tw/scan.json
        id: build
        run: python build_site.py --market tw --scheduled

      - name: Restore previous TW state from scan-state
        run: |
          if git fetch --depth=1 origin scan-state 2>/dev/null; then
            git show FETCH_HEAD:state_tw.json > state_tw.json \
              || { rm -f state_tw.json; echo "scan-state has no state_tw.json (treated as first run)"; }
          else
            echo "no scan-state branch yet (first run)"
          fi

      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # D34：右肩確認表格由機器人發（未設定時退回 webhook）；關注清單由 Cloudflare Worker 提供。都沒設定也能跑。
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_MAIN_CHANNEL_ID: ${{ secrets.DISCORD_MAIN_CHANNEL_ID }}
          DISCORD_WATCH_CHANNEL_ID: ${{ secrets.DISCORD_WATCH_CHANNEL_ID }}
          WATCHLIST_API_URL: ${{ secrets.WATCHLIST_API_URL }}
          WATCHLIST_SYNC_KEY: ${{ secrets.WATCHLIST_SYNC_KEY }}
        run: |
          args="--scan site/data/tw/scan.json --state state_tw.json"
          [ "$DRY_RUN" = "true" ] && args="$args --dry-run"
          [ "$NOTIFY_ALL" = "true" ] && args="$args --notify-all"
          [ "$TEST_MESSAGE" = "true" ] && args="$args --test-message"
          args="$args --preview-dir output/notify-preview"
          python notify_discord.py $args

      # D34：關注清單裡的標的狀態改變 -> 機器人發到關注頻道，並回寫 last_status。失敗只警告，不影響後面的存 state／發布。
      # test_message 時不跑（那一次只驗證圖片上傳）。
      - name: Notify watchlist changes
        if: ${{ !cancelled() && github.event.inputs.test_message != 'true' }}
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_WATCH_CHANNEL_ID: ${{ secrets.DISCORD_WATCH_CHANNEL_ID }}
          WATCHLIST_API_URL: ${{ secrets.WATCHLIST_API_URL }}
          WATCHLIST_SYNC_KEY: ${{ secrets.WATCHLIST_SYNC_KEY }}
        run: |
          args="--scan site/data/tw/scan.json"
          [ "$DRY_RUN" = "true" ] && args="$args --dry-run"
          args="$args --preview-dir output/notify-preview"
          python notify_watchlist.py $args

      # D39：止盈追蹤（已突破的頭肩底＋向上突破的三角形，碰到 TP1／TP2 由機器人發到 #台股止盈）。
      # 追蹤檔 tp_tracker_tw.json 存在 scan-state；分支存在但讀不到時跳過這一步（不覆寫追蹤檔）。
      - name: Restore take-profit tracker from scan-state
        id: tp_restore
        if: ${{ !cancelled() && steps.build.outcome == 'success' && github.event.inputs.test_message != 'true' }}
        run: |
          set +e
          git ls-remote --exit-code --heads origin scan-state >/dev/null; rc=$?
          set -e
          if [ "$rc" = "2" ]; then echo "no scan-state branch yet (first run)"; echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$rc" != "0" ] || ! git fetch --depth=1 origin scan-state; then
            echo "::warning::could not read scan-state; take-profit step skipped this run"; echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git cat-file -e FETCH_HEAD:tp_tracker_tw.json 2>/dev/null; then git show FETCH_HEAD:tp_tracker_tw.json > tp_tracker_tw.json
          else echo "scan-state has no tp_tracker_tw.json yet (first run: events are only recorded)"; fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Notify take-profit
        if: ${{ !cancelled() && steps.tp_restore.outputs.ok == 'true' }}
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          DISCORD_TP_CHANNEL_TW: ${{ secrets.DISCORD_TP_CHANNEL_TW }}
        run: |
          args="--scan site/data/tw/scan.json --tracker tp_tracker_tw.json"
          [ "$DRY_RUN" = "true" ] && args="$args --dry-run"
          args="$args --preview-dir output/notify-preview"
          python notify_tp.py $args

      # D32：dry-run 時把會附在 Discord 的圖存成 artifact，方便檢查（bars 檔與 scan.json 在 site/data 內，同一個 job）。
      - name: Upload notify preview images
        if: ${{ !cancelled() && github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: notify-preview
          path: output/notify-preview/
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload site as artifact
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: site/
          retention-days: 7
          if-no-files-found: error

      - name: Upload state as artifact
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: state
          path: |
            state_tw.json
            tp_tracker_tw.json
          retention-days: 7
          if-no-files-found: warn

  publish:
    needs: scan
    if: ${{ !cancelled() && needs.scan.outputs.build_ok == 'true' && github.event.inputs.dry_run != 'true' && github.event.inputs.test_message != 'true' }}
    uses: ./.github/workflows/publish.yml
    with:
      market: tw
      state_file: state_tw.json
      tp_file: tp_tracker_tw.json
    secrets: inherit
