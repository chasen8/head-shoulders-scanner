# 定時掃描 + Discord 通知。
# repo 是私有的（charter D16）；網站推到公開 repo chasen8/head-shoulders-site 由 Pages 提供（D25）：
#   https://chasen8.github.io/head-shoulders-site/
#   - 結果與通知狀態存在獨立的 orphan 分支 `scan-state`（state.json + site/data/；台股的 state_tw.json +
#     site/data/tw/ 也在同一分支，D29）。
#   - 每次執行的 site/ 也上傳成 artifact（保留 7 天）；發布由 publish job（publish.yml）做。
# 台股另有 scan-tw.yml（平日 UTC 06:10）。
# 需要的 secret：DISCORD_WEBHOOK_URL（沒設也能跑：只更新 state，印「未設定 webhook」）。
# D39 止盈通知：DISCORD_BOT_TOKEN＋DISCORD_GUILD_ID（用名稱找 #加密止盈；或 DISCORD_TP_CHANNEL_CRYPTO 直接指定），沒設定只印提示。
# 資料來源：幣安現貨 data-api.binance.vision、OKX 現貨/永續、Gate 永續，全是公開端點不需金鑰（charter D3、D22）；
# 幣安永續 fapi 在美國 runner 回 451，預設不掃。
#
# 排程：UTC 每 4 小時的第 7 分鐘（00:07, 04:07, ...），4h K 線收盤後 7 分鐘；
# 也涵蓋 1d（UTC 00:00 收盤）與 1w（週一 UTC 00:00 收盤）。
# 若改 cron，build_site.py 的 SCAN_EVERY_HOURS / SCAN_MINUTE 也要一起改（網站「下次掃描」用它）。
name: Scan and notify

on:
  schedule:
    - cron: "7 */4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只印出會發送的內容，不送 Discord、不更新 scan-state"
        type: boolean
        default: false
      notify_all:
        description: "沒有 state 時逐筆通知（預設只發一則摘要）"
        type: boolean
        default: false
      test_message:
        description: "只送一則「測試：圖片通知」（目前分數最高 1 筆，附圖；不改 state、不發布），用來驗證 Discord 圖片上傳"
        type: boolean
        default: false

permissions:
  contents: write  # publish job 推 scan-state 分支
  actions: read    # D41：失敗通知要讀這次 run 的 job／步驟結果

# 此 workflow 只由 schedule / workflow_dispatch 觸發；沒有 push 觸發，
# 所以推 scan-state 分支不會引發任何 workflow 迴圈（且 GITHUB_TOKEN 的 push 本來就不會觸發 workflow）。
concurrency:
  group: scan-and-notify
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # 本機實測全部來源約 10 分鐘（D22）；上限 30
    outputs:
      build_ok: ${{ steps.build.outcome == 'success' }}
    env:
      DRY_RUN: ${{ github.event.inputs.dry_run }}
      NOTIFY_ALL: ${{ github.event.inputs.notify_all }}
      TEST_MESSAGE: ${{ github.event.inputs.test_message }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      # build_site.py 失敗率 >20% 會非零退出 -> 後面所有步驟（通知、改 state）都不跑。
      - name: Scan and write site/data/scan.json
        id: build
        run: python build_site.py --scheduled

      # D41 (b2)：build 成功但失敗序列 >5% 或有 source_errors -> 機器人發到 #測試（同一問題 24 小時內不重複，狀態 alert_state.json 存 scan-state）。
      # 只警告、不影響流程；dry-run／test_message 不跑。沒有 scan-state 或讀不到時當作第一次。
      - name: Scan health check
        if: ${{ !cancelled() && steps.build.outcome == 'success' && github.event.inputs.dry_run != 'true' && github.event.inputs.test_message != 'true' }}
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          DISCORD_ALERT_CHANNEL_ID: ${{ secrets.DISCORD_ALERT_CHANNEL_ID }}
          DISCORD_ALERT_CHANNEL_NAME: ${{ vars.DISCORD_ALERT_CHANNEL_NAME }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if git fetch --depth=1 origin scan-state 2>/dev/null && git cat-file -e FETCH_HEAD:alert_state.json 2>/dev/null; then
            git show FETCH_HEAD:alert_state.json > alert_state.json
          fi
          python3 scripts/health_alert.py scan-health --market crypto --scan site/data/scan.json --state alert_state.json

      - name: Restore previous state from scan-state
        id: restore
        run: |
          if git fetch --depth=1 origin scan-state 2>/dev/null; then
            git show FETCH_HEAD:state.json > state.json && echo "found=true" >> "$GITHUB_OUTPUT" \
              || echo "scan-state has no state.json (treated as first run)"
          else
            echo "no scan-state branch yet (first run)"
          fi

      - name: Notify Discord
        id: notify
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # D34：右肩確認表格由機器人發（未設定時退回 webhook）；關注清單由 Cloudflare Worker 提供。都沒設定也能跑。
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_MAIN_CHANNEL_ID: ${{ secrets.DISCORD_MAIN_CHANNEL_ID }}
          DISCORD_WATCH_CHANNEL_ID: ${{ secrets.DISCORD_WATCH_CHANNEL_ID }}
          WATCHLIST_API_URL: ${{ secrets.WATCHLIST_API_URL }}
          WATCHLIST_SYNC_KEY: ${{ secrets.WATCHLIST_SYNC_KEY }}
        run: |
          args=""
          [ "$DRY_RUN" = "true" ] && args="$args --dry-run"
          [ "$NOTIFY_ALL" = "true" ] && args="$args --notify-all"
          [ "$TEST_MESSAGE" = "true" ] && args="$args --test-message"
          args="$args --preview-dir output/notify-preview"
          python notify_discord.py $args

      # D34：關注清單裡的標的狀態改變 -> 機器人發到關注頻道，並回寫 last_status。失敗只警告，不影響後面的存 state／發布。
      # test_message 時不跑（那一次只驗證圖片上傳）。
      - name: Notify watchlist changes
        if: ${{ !cancelled() && github.event.inputs.test_message != 'true' }}
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_WATCH_CHANNEL_ID: ${{ secrets.DISCORD_WATCH_CHANNEL_ID }}
          WATCHLIST_API_URL: ${{ secrets.WATCHLIST_API_URL }}
          WATCHLIST_SYNC_KEY: ${{ secrets.WATCHLIST_SYNC_KEY }}
        run: |
          args="--scan site/data/scan.json"
          [ "$DRY_RUN" = "true" ] && args="$args --dry-run"
          args="$args --preview-dir output/notify-preview"
          python notify_watchlist.py $args

      # D39：止盈追蹤（已突破的頭肩底＋向上突破的三角形，碰到 TP1／TP2 由機器人發到 #加密止盈）。
      # 追蹤檔 tp_tracker.json 存在 scan-state；分支存在但讀不到時跳過這一步（不覆寫追蹤檔）。
      - name: Restore take-profit tracker from scan-state
        id: tp_restore
        if: ${{ !cancelled() && steps.build.outcome == 'success' && github.event.inputs.test_message != 'true' }}
        run: |
          set +e
          git ls-remote --exit-code --heads origin scan-state >/dev/null; rc=$?
          set -e
          if [ "$rc" = "2" ]; then echo "no scan-state branch yet (first run)"; echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$rc" != "0" ] || ! git fetch --depth=1 origin scan-state; then
            echo "::warning::could not read scan-state; take-profit step skipped this run"; echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git cat-file -e FETCH_HEAD:tp_tracker.json 2>/dev/null; then git show FETCH_HEAD:tp_tracker.json > tp_tracker.json
          else echo "scan-state has no tp_tracker.json yet (first run: events are only recorded)"; fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Notify take-profit
        if: ${{ !cancelled() && steps.tp_restore.outputs.ok == 'true' }}
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          DISCORD_TP_CHANNEL_CRYPTO: ${{ secrets.DISCORD_TP_CHANNEL_CRYPTO }}
        run: |
          args="--scan site/data/scan.json --tracker tp_tracker.json"
          [ "$DRY_RUN" = "true" ] && args="$args --dry-run"
          args="$args --preview-dir output/notify-preview"
          python notify_tp.py $args

      # notify 送失敗時也要存 state（沒送成功的型態不會被記錄，下次重試），所以用 !cancelled()。
      # scan-state 與公開網站在 publish job 推送（D29：保留台股那一邊的檔案）；dry-run 不推。
      # D32：dry-run 時把會附在 Discord 的圖存成 artifact，方便檢查（bars 檔與 scan.json 在 site/data 內，同一個 job）。
      - name: Upload notify preview images
        if: ${{ !cancelled() && github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: notify-preview
          path: output/notify-preview/
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload site as artifact
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: site/
          retention-days: 7
          if-no-files-found: error

      - name: Upload state as artifact
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: state
          path: |
            state.json
            tp_tracker.json
            alert_state.json
          retention-days: 7
          if-no-files-found: warn

      # D41 (b1)：這個 job 任何步驟失敗 -> 機器人發到 #測試，附失敗步驟名稱與 run 網址（需要 actions: read）。
      - name: Alert on failure
        if: ${{ failure() && github.event.inputs.dry_run != 'true' && github.event.inputs.test_message != 'true' }}
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          DISCORD_ALERT_CHANNEL_ID: ${{ secrets.DISCORD_ALERT_CHANNEL_ID }}
          DISCORD_ALERT_CHANNEL_NAME: ${{ vars.DISCORD_ALERT_CHANNEL_NAME }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/health_alert.py failure --market crypto --stage scan

  # D25 + D29：scan-state 分支與公開網站 chasen8/head-shoulders-site 都是 force push 單一 commit。
  # 台股（scan-tw.yml）也推同一個地方，所以發布改由共用的 publish.yml 做：只換掉加密貨幣自己的檔案、
  # 保留台股的 data/tw 與 state_tw.json；concurrency group publish-site 讓兩邊的發布不會同時進行。
  publish:
    needs: scan
    if: ${{ !cancelled() && needs.scan.outputs.build_ok == 'true' && github.event.inputs.dry_run != 'true' && github.event.inputs.test_message != 'true' }}
    uses: ./.github/workflows/publish.yml
    with:
      market: crypto
      state_file: state.json
      tp_file: tp_tracker.json
      alert_file: alert_state.json
    secrets: inherit
